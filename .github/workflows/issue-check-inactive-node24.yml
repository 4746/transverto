name: Issue Check Inactive

on:
  schedule:
    - cron: "0 0 */15 * *"

permissions:
  contents: read

jobs:
  issue-check-inactive:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Mark inactive issues and pull requests
        uses: actions/github-script@v8
        with:
          script: |
            const inactiveDays = 30;
            const inactiveLabel = 'Inactive';
            const cutoff = Date.now() - inactiveDays * 24 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;

            const items = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              },
            );

            for (const item of items) {
              const labels = item.labels.map((label) =>
                typeof label === 'string' ? label : label.name,
              );

              if (labels.includes(inactiveLabel)) {
                continue;
              }

              const updatedAt = new Date(item.updated_at).getTime();

              if (updatedAt > cutoff) {
                continue;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: item.number,
                labels: [inactiveLabel],
              });

              core.info(`Added "${inactiveLabel}" to #${item.number}.`);
            }
